# Apache para One Life One Body.
#
# El puerto real lo pone el entrypoint: Railway y Render lo pasan en la
# variable PORT y no siempre es el 80.

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        # Laravel trae su propio .htaccess, que es quien manda todo lo
        # que no sea un fichero real a index.php. Sin AllowOverride ese
        # fichero se ignora y solo funcionaría la portada.
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    # Los ficheros con hash en el nombre (assets/index-ABC123.js) no
    # cambian nunca: si cambia el contenido, cambia el nombre. Se pueden
    # cachear para siempre.
    <LocationMatch "^/assets/">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </LocationMatch>

    # Los registros van a la salida del contenedor, que es donde los
    # lee el panel del hosting.
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
